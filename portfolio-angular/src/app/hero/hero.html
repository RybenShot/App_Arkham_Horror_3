<div class="wrap">
  <section class="hero" id="top">
    <div class="hero-copy" id="sobre-mi">
      <p class="eyebrow">Sebastián Jiménez Román · FullStack Developer</p>
      <h1 class="thesis"> <span class="logic">{{ 'hero.thesis.logic' | t }}</span><span class="and">&nbsp;{{ 'hero.thesis.and' | t }}</span> <span class="creative">{{ 'hero.thesis.creative' | t }}</span></h1>

      <p [innerHTML]="'hero.bio' | t"></p>
    </div>
    <div class="avatar" id="avatar">
      <div class="avatar-circle" #avatarCircle>
        <img class="avatar-base" src="/img/avatar-real.jpg" alt="Sebastián Jiménez Román">
        <img class="avatar-glitch" [src]="glitchSrc" alt="">
        <div class="avatar-noise"></div>
      </div>
      <img class="avatar-frame" src="/img/avatar-frame.png" alt="">
    </div>
  </section>

  <section class="callout" id="devir">
    <p class="tag">{{ 'callout.tag' | t }}</p>
    <h2>Devir Play — TypeScript / Gameplay Developer</h2>

    <p class="callout-intro" [innerHTML]="'callout.intro' | t"></p>

    <ul>
      <li [innerHTML]="'callout.li1' | t"></li>
      <li [innerHTML]="'callout.li2' | t"></li>
      <li [innerHTML]="'callout.li3' | t"></li>
      <li [innerHTML]="'callout.li4' | t"></li>
      <li [innerHTML]="'callout.li5' | t"></li>
    </ul>

    <p class="callout-why" [innerHTML]="'callout.why' | t"></p>

    <a class="detail" href="https://github.com/RybenShot/App_Arkham_Horror_3#readme" target="_blank" rel="noopener"> {{ 'callout.link' | t }} </a>
  </section>

</div>
