<footer id="contact">
  <div class="wrap">
    <p class="fq">{{ 'footer.headline' | t }}</p>
    <div class="contact-links">
      <a href="mailto:sebastianjimenezroman@hotmail.com">sebastianjimenezroman@hotmail.com</a>
      <a href="https://linkedin.com/in/sebastian-jimenez-roman" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/RybenShot" target="_blank" rel="noopener">GitHub</a>
    </div>

    <form class="contact-form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="contact-name">{{ 'footer.field.name' | t }}</label>
        <input id="contact-name" type="text" name="name" autocomplete="name" [(ngModel)]="senderName">
      </div>
      <div class="field">
        <label for="contact-email">{{ 'footer.field.email' | t }}</label>
        <input id="contact-email" type="email" name="email" autocomplete="email" [(ngModel)]="senderEmail">
      </div>
      <div class="field">
        <label for="contact-message">{{ 'footer.field.message' | t }}</label>
        <textarea id="contact-message" name="message" required [placeholder]="'footer.field.messagePlaceholder' | t" [(ngModel)]="message"></textarea>
      </div>
      <button type="submit" [disabled]="!message.trim() || state === 'sending'">
        {{ (state === 'sending' ? 'footer.button.sending' : 'footer.button.send') | t }}
      </button>

      @if (state === 'sent') {
        <p class="contact-form-note contact-form-ok">{{ 'footer.note.sent' | t }}</p>
      } @else if (state === 'error') {
        <p class="contact-form-note contact-form-err">{{ 'footer.note.errorBefore' | t }}{{ contactEmail }}.</p>
      }
    </form>
  </div>
</footer>
